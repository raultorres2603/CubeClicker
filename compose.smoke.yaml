# Containerized smoke test — opt-in override, never started by a plain `podman compose up`.
# Run: podman compose -f compose.yaml -f compose.smoke.yaml run --rm smoke
# The prod frontend image is smoke-only: build the dependency explicitly if the compose
# provider does not auto-build it:
#   podman compose -f compose.yaml -f compose.smoke.yaml build frontend-prod
services:
  db:
    environment:
      POSTGRES_USER: "cubeclicker"
      POSTGRES_PASSWORD: "cubeclicker"
      POSTGRES_DB: "cubeclicker"

  backend:
    environment:
      MAX_USERS_PER_SERVER: "2"
      RECONNECT_GRACE_MS: "1000"
      DATABASE_URL: "postgres://cubeclicker:cubeclicker@db:5432/cubeclicker"
      # Pin SMTP to the in-stack Mailpit so host/provider exports cannot
      # redirect the smoke run to a real relay. `compose.yaml` still uses
      # `${SMTP_*:-…}` interpolation for normal local development.
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "no-reply@cubeclicker.local"
      SMTP_SECURE: "false"

  frontend-prod:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: prod
    image: cubeclicker-frontend:prod-smoke

  smoke:
    image: docker.io/library/node:24-alpine
    working_dir: /smoke
    volumes:
      - "./tests/e2e:/smoke:ro,z"
    command: ["node", "smoke.mjs"]
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      frontend-prod:
        condition: service_started
      mailpit:
        condition: service_started
