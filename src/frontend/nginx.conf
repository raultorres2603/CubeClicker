# CubeClicker frontend — static SPA served by the unprivileged nginx image.
# The image runs as a non-root user and listens on 8080 (unprivileged port).
#
# Delivery contract (feature `frontend-delivery-hardening`, AC-7/AC-8):
# - gzip only; the nginxinc/nginx-unprivileged base image has no ngx_brotli module.
# - Hashed /assets/* files are content-addressed, so they may be cached immutably.
# - The app shell (/, /index.html, SPA fallback) revalidates, so a deploy is picked up.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 128;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml;

    # Hashed build artifacts: immutable for one year; a missing asset is a real 404
    # (never the app shell). `add_header` without `always` applies to 200s only, so a
    # 404 does not inherit the long-cache header.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell must revalidate so clients pick up new asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes resolve to the app shell (and revalidate).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
