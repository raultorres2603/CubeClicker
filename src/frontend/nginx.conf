# CubeClicker frontend — static SPA served by the unprivileged nginx image.
# The image runs as a non-root user and listens on 8080 (unprivileged port).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes resolve to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
