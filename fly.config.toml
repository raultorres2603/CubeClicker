# CubeClicker Fly.io app configuration for both environments.
# The deploy workflow supplies the only app name and region:
#   flyctl deploy --app "$FLY_APP_NAME" --primary-region "$FLY_REGION"
# This file deliberately carries neither value, so no second, stale source exists.

[build]
  dockerfile = "src/backend/Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 180
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
