# CubeClicker — local development stack (single command: `podman compose up`).
# Backend/frontend health signals come from each image's HEALTHCHECK (no duplicate
# healthcheck here); the `db` supporting service carries its own healthcheck so
# the backend can gate startup on it.
name: cubeclicker

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cubeclicker}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cubeclicker}"
      POSTGRES_DB: "${POSTGRES_DB:-cubeclicker}"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubeclicker} -d ${POSTGRES_DB:-cubeclicker}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      target: dev
    image: cubeclicker-backend:dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      NODE_ENV: development
      MAX_USERS_PER_SERVER: "${MAX_USERS_PER_SERVER:-10}"
      DATABASE_URL: "${DATABASE_URL:-postgres://cubeclicker:cubeclicker@db:5432/cubeclicker}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@cubeclicker.local}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:5173}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:5173}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    volumes:
      - "./src/backend:/app/src/backend:z"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: dev
    image: cubeclicker-frontend:dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_WS_URL: "${VITE_WS_URL:-ws://localhost:8080/ws}"
    volumes:
      - "./src/frontend:/app/src/frontend:z"

volumes:
  db-data: